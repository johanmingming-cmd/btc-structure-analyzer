name: Prediction Lab Research Harness Historical Validation
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - implementation/prediction-lab-stage-b3-core
permissions:
  contents: read
jobs:
  historical-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Accept Android SDK licenses
        shell: bash
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Install Android test SDK
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Validate downloader and universe filters
        run: |
          python -m py_compile scripts/download_binance_multi_coin_history.py
          python -m unittest scripts.test_download_binance_multi_coin_history -v
      - name: Download one frozen 180-day dataset
        env:
          MULTI_HISTORY_DAYS: "180"
          MULTI_HISTORY_COINS: "10"
          MULTI_HISTORY_END_TIME_MS: ${{ inputs.end_time_ms }}
          MULTI_HISTORY_SYMBOLS: ${{ inputs.symbols }}
          MULTI_HISTORY_DIR: ${{ github.workspace }}/build/multi-coin-history
        run: python scripts/download_binance_multi_coin_history.py
      - name: Verify and summarize frozen dataset
        shell: bash
        run: |
          test "$(find "$GITHUB_WORKSPACE/build/multi-coin-history" -mindepth 1 -maxdepth 1 -type d | wc -l)" -ge 10
          test -s "$GITHUB_WORKSPACE/build/multi-coin-history/manifest.json"
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path("build/multi-coin-history/manifest.json").read_text())
          print(json.dumps(manifest, indent=2))
          assert len(manifest["symbols"]) >= 10
          assert manifest["requestedDays"] >= 180
          assert set(manifest["datasetCoverage"]) == set(manifest["symbols"])
          PY
      - name: Run chronological multi-coin research and save report
        env:
          MULTI_HISTORY_DIR: ${{ github.workspace }}/build/multi-coin-history
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon testDebugUnitTest --tests com.btcstructureanalyzer.HistoricalMultiCoinValidationTest 2>&1 | tee build/research-report.log
      - name: Retain exact dataset, manifest and research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prediction-lab-research-${{ github.run_number }}
          path: |
            build/multi-coin-history/
            build/research-report.log
          if-no-files-found: warn
          retention-days: 30
