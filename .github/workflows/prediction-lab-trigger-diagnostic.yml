name: Prediction Lab Trigger Diagnostic
on:
  push:
    branches:
      - implementation/prediction-lab-stage-b3-core
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - design/prediction-lab-stage-b2
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm matching triggers and permissions
        run: echo "Trigger and permission configuration accepted"
