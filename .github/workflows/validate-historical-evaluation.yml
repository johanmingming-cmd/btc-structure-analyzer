name: Validate Historical Evaluation Fix
on:
  push:
    branches:
      - fix/historical-spot-evaluation
      - feature/stage1-evaluation-10m-ui-cleanup
      - fix/prediction-lab-audit-2026
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - feature/stage1-evaluation-10m-ui-cleanup
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Install Android platform and build tools
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Download public BTCUSDT Spot history
        env:
          BTC_HISTORY_DAYS: "90"
          BTC_HISTORY_DIR: build/btc-history
        run: python scripts/download_binance_spot_history.py
      - name: Compile debug APK
        run: gradle --no-daemon assembleDebug
      - name: Run unit and real-data validation tests
        env:
          BTC_HISTORY_DIR: build/btc-history
        run: gradle --no-daemon testDebugUnitTest
