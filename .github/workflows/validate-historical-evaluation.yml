name: Validate Historical Evaluation Fix

on:
  push:
    branches:
      - fix/historical-spot-evaluation
      - feature/stage1-evaluation-10m-ui-cleanup
      - audit/prediction-lab-data-quality-storage
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Install Android platform and build tools
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Compile debug APK
        run: gradle --no-daemon assembleDebug
      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Run Android instrumentation tests
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -memory 4096 -cores 2
          script: |
            set +e
            LOGCAT_FILE="$RUNNER_TEMP/android-instrumentation-logcat.txt"
            adb logcat -c || true
            adb logcat -v threadtime > "$LOGCAT_FILE" 2>&1 &
            LOGCAT_PID=$!
            echo "Emulator boot state:"
            adb shell getprop sys.boot_completed || true
            echo "Installed instrumentation targets:"
            adb shell pm list instrumentation || true
            timeout --signal=TERM --kill-after=30s 8m gradle --no-daemon --info connectedDebugAndroidTest
            TEST_STATUS=$?
            kill "$LOGCAT_PID" 2>/dev/null || true
            wait "$LOGCAT_PID" 2>/dev/null || true
            if [ "$TEST_STATUS" -ne 0 ]; then
              echo "Instrumentation failed (exit: $TEST_STATUS). Captured logcat follows."
              adb devices -l || true
              adb shell getprop sys.boot_completed || true
              tail -n 1500 "$LOGCAT_FILE" || true
              exit "$TEST_STATUS"
            fi
