name: Prediction Lab Research Harness Unit Tests
on:
  workflow_dispatch:
  push:
    branches:
      - experiment/prediction-lab-research-harness
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Accept Android SDK licenses
        shell: bash
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Install Android test SDK
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Validate Python downloader syntax
        run: python -m py_compile scripts/download_binance_multi_coin_history.py
      - name: Test historical downloader and universe filters
        run: python -m unittest scripts.test_download_binance_multi_coin_history -v
      - name: Run focused Kotlin detector and engine unit tests
        run: |
          gradle --no-daemon testDebugUnitTest \
            --tests com.btcstructureanalyzer.RangeReversalDetectorTest \
            --tests com.btcstructureanalyzer.TrendSetupDetectorTest \
            --tests com.btcstructureanalyzer.AdaptivePredictionEngineTest \
            --tests com.btcstructureanalyzer.WalkForwardEvaluatorTest
